name: Build Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x64
            runner: ubuntu-latest
            flutter_arch: x64
            sfx: ""
            deb_name: moshi_novel_amd64.deb
          - arch: arm64
            target: arm64
            runner: ubuntu-24.04-arm
            flutter_arch: arm64
            sfx: "-arm64"
            deb_name: moshi_novel_arm64.deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (x64 via action)
        if: matrix.flutter_arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true

      - name: Setup Flutter (arm64 via git)
        if: matrix.flutter_arch == 'arm64'
        run: |
          sudo apt-get install -y git unzip xz-utils
          sudo git clone --depth 1 -b stable https://github.com/flutter/flutter.git /opt/flutter
          sudo chown -R "$USER":"$USER" /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          /opt/flutter/bin/flutter --version

      - name: Install Linux deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release (${{ matrix.target }})
        run: flutter build linux --release --target-platform=linux-${{ matrix.target }}

      - name: Package tar.gz
        run: |
          cd build/linux/${{ matrix.target }}/release/bundle
          tar czf "${GITHUB_WORKSPACE}/MoshiNovel-Linux${{ matrix.sfx }}.tar.gz" .
          ls -lh "${GITHUB_WORKSPACE}/MoshiNovel-Linux${{ matrix.sfx }}.tar.gz"

      - name: Package deb
        run: |
          set -e
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/opt/moshi_novel
          cp -r build/linux/${{ matrix.target }}/release/bundle/* pkg/opt/moshi_novel/
          chmod -R a+rX pkg/opt/moshi_novel
          ln -sf /opt/moshi_novel/moshi_novel pkg/usr/bin/moshi_novel
          sed "s/^Architecture:.*/Architecture: ${{ matrix.arch }}/" packaging/control > pkg/DEBIAN/control
          dpkg-deb --build pkg ${{ matrix.deb_name }}
          ls -lh ${{ matrix.deb_name }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MoshiNovel-Linux${{ matrix.sfx }}.tar.gz
            ${{ matrix.deb_name }}
